name: HOME 5 Build

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking HOME 5..."
          test -f Makefile
          test -f source/main.c
          echo "Project files found"
